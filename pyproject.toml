[project]
name = "acme-invoice-agents"
version = "0.1.0"
description = "Multi-agent invoice processing prototype: extraction, inventory validation, approval and guarded payment."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "defusedxml>=0.7.1",
    "langgraph>=1.2.16",
    "openai>=3.32.0",
    "pdfplumber>=0.11.10",
    "pydantic>=2",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invoice_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
