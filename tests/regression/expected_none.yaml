# Expected outcomes in `--llm none` mode, in batch order (data/invoices sorted by file name,
# then data/synthetic). Derived from the rules (PLAN section 0 plus the It2 risk rubric) before the
# regression run. `codes` is the exact set of finding codes (including note-level risk signals).
- {file: data/invoices/invoice_1001.txt, decision: APPROVE, codes: []}
- {file: data/invoices/invoice_1002.txt, decision: HOLD, codes: [extraction_failed]}
- file: data/invoices/invoice_1003.txt
  decision: REJECT
  codes: [missing_due_date, risk_invalid_due_date, risk_pressure_language, risk_round_total, risk_score, stock_exceeded]
- {file: data/invoices/invoice_1004.json, decision: APPROVE, codes: []}
- {file: data/invoices/invoice_1004_revised.json, decision: HOLD, codes: [revision]}
- {file: data/invoices/invoice_1005.json, decision: HOLD, codes: [stock_exceeded]}
- {file: data/invoices/invoice_1006.csv, decision: APPROVE, codes: []}
- {file: data/invoices/invoice_1007.csv, decision: REJECT, codes: [arithmetic, stock_exceeded]}
- {file: data/invoices/invoice_1008.txt, decision: HOLD, codes: [extraction_failed]}
- {file: data/invoices/invoice_1009.json, decision: REJECT, codes: [bad_quantity, missing_due_date, missing_vendor, subtotal_mismatch]}
- {file: data/invoices/invoice_1010.txt, decision: APPROVE, codes: []}
- {file: data/invoices/invoice_1011.pdf, decision: APPROVE, codes: []}
- {file: data/invoices/invoice_1011.txt, decision: DUPLICATE, codes: [duplicate]}
- {file: data/invoices/invoice_1012.pdf, decision: HOLD, codes: [extraction_failed]}
- {file: data/invoices/invoice_1012.txt, decision: HOLD, codes: [extraction_failed]}
- {file: data/invoices/invoice_1013.json, decision: REJECT, codes: [arithmetic, stock_exceeded]}
- {file: data/invoices/invoice_1013.pdf, decision: DUPLICATE, codes: [duplicate]}
- {file: data/invoices/invoice_1014.xml, decision: HOLD, codes: [non_usd]}
- {file: data/invoices/invoice_1015.csv, decision: APPROVE, codes: []}
- {file: data/invoices/invoice_1016.json, decision: HOLD, codes: [item_needs_mapping]}
- {file: data/synthetic/invoice_9001.json, decision: HOLD, codes: [vp_requires_llm]}
- {file: data/synthetic/invoice_9003.txt, decision: HOLD, codes: [item_needs_mapping]}
